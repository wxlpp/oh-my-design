name: CI

on:
  push:
    # 不含 issue-** ：每个 Issue 分支开 PR 后，push 与 pull_request 会各触发一次，
    # 同一 sha 跑两遍完整 macOS job 集（6 个 job）。macOS runner 按 10× 计费，
    # 而本 workflow 会被后续 10 个 Issue 继承。PR 已覆盖 issue-* 分支。
    branches: [main, 'epic/**']
  pull_request:

# 最小权限。仓库当前默认就是 read，但那是可被改动的仓库级设置，显式钉住。
permissions:
  contents: read

# 快速连续 push 时取消上一轮，避免堆叠整套 macOS job。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftpm:
    name: SwiftPM
    # 钉死 macos-26 而非 macos-latest：两者当前解析到同一镜像
    # （macOS 26.4 / Xcode 26.5），但 latest 会随 GitHub 滚动。
    # runner 默认选中的就是 Xcode 26.5，无需 xcode-select 步骤。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        # ToastHostTests 的三个 timing 用例依赖真实墙钟（Task.sleep + 固定 buffer），
        # 在负载较高的 runner 上会 flake。仅当失败用例**全部**落在这三个上才重跑
        # 一次；其余任何失败直接判红——本 epic 改的是全库隔离语义，真实的并发时序
        # 回归表现形式与 flake 完全一致，无差别重试会把它洗白。
        #
        # 三个用例都已确认是**既有** flake：第一轮评审在计划 commit(4dcb801,零代码
        # 改动、无 defaultIsolation)上就观察到 ToastHostTests.swift:108-110 失败。
        run: |
          set -o pipefail
          run_tests() {
            # ⚠️ **必须 `--skip OhMyDesignShadersTests`**，且这是**显式跳过、不是静默放过**：
            # 原生 SwiftPM **不编译 `.metal`**（#248 spike 实测），bundle 里不会有
            # metallib，而 `OhMyDesignShaders.assertShaderLibraryLoadable` 是 fail-closed
            # 的——它不会"查不到就算了"。该 target 由下面独立的 swiftbuild 步骤覆盖。
            #
            # ⚠️ **不要**改成给那个测试加 `.enabled(if:)` 让本腿变绿——那会把"metallib
            # 没编出来"变成静默跳过，正是本仓反复堵的假绿病型（对照 #258 发现的
            # `ColorAssetGuardTests` 在 swiftbuild 下静默失守）。
            swift test --skip OhMyDesignShadersTests
          }
          run_tests 2>&1 | tee first.log || {
            # 先落到变量再匹配：`grep -q` 命中即退出并向上游发 SIGPIPE，
            # 而 pipefail 会把 141 提升为整条管道的退出码，使 if 恒假、
            # 一切失败都走「重跑」。
            fails=$( { grep 'recorded an issue' first.log
                       grep -E 'Test "[^"]*" failed after' first.log
                     } || true )
            # 空集 = 非测试类失败（编译错误等）→ 直接判红，不重跑。
            # 锚点用三个 flaky 用例的**唯一名称**，不用 'dismiss(id:)'——
            # 后者会命中另外两个确定性用例（排队中的 item 直接移除 / 不存在的 id
            # 是 no-op），把它们的真实失败一起洗白。
            if [ -z "$fails" ] || grep -qvE '进入 dismissing 状态|double-fire|advance 到下一条' <<< "$fails"; then
              echo "存在已知 flake 之外的失败 → 直接判红"; exit 1
            fi
            echo "仅已知 flake 失败，重跑一次"
            run_tests 2>&1 | tee second.log
          }

      - name: Test (swiftbuild) — OhMyDesignShaders
        # ⚠️ 只有 swiftbuild / xcodebuild 会真正编译 `.metal` 成 metallib；原生
        # `swift build` 只会把声明为资源的 `.metal` **源码**拷进 bundle（#248 spike）。
        # ⇒ shader 的加载检查只能在这条路径上作数。
        #
        # ⚠️ **本腿其余部分刻意保持 native**：整腿切 swiftbuild 会让
        # `ColorAssetGuardTests` 的 colorset 存在性守卫**静默跳过**——swiftbuild 调
        # actool 把 `.xcassets` 编成 `Assets.car`，而那个 suite 的启用条件是
        # 「`Resources.xcassets/` 以目录形式存在」（#258 终审 C-1 实测）。
        run: |
          set -o pipefail
          swift test --build-system swiftbuild --filter OhMyDesignShadersTests 2>&1 \
            | tee shaders.log
          # ⚠️ **filter 命不中的 bundle 会打印「0 tests … passed」且不影响退出码**
          # （#261 第 4 轮实测）。若 test target 改名/拆分导致 `--filter` 匹配为空，
          # 本步骤会**绿**，而上一步的 `--skip OhMyDesignShadersTests` 也一起静默失效
          # ⇒ 整个 metallib 覆盖从 CI 消失、两条腿全绿。
          grep -qE 'Test run with [1-9][0-9]* tests?' shaders.log \
            || { echo "::error::swiftbuild 腿一条 shader 测试都没跑（--filter 失配？）"; exit 1; }

      - name: MainActor static ratchet
        # ⚠️⚠️ 这一步不是「再多跑一个 lint」，它是 `#290` 那份**一次性人工枚举**唯一的
        # 自动化替代品（#307）：本包三个 target 都开了 `.defaultIsolation(MainActor.self)`，
        # 新加的公开 `static` 成员**默认**被卷进 MainActor，下游在非主 actor 语境取用会
        # 报错或被迫 `await`。`downstream-probe` job 只钉住**它自己引用到的**符号
        # ——新类型上的新成员它一个都看不见。本步从 symbol graph 取编译器算出来的隔离，
        # 与 `docs/mainactor-static-exemptions.txt` 做**双向差集**（多一条少一条都判红）。
        #
        # ⚠️ 放在 `swift test` 之后是为了复用**热 `.build`**：`dump-symbol-graph` 本身
        # 要重新跑一遍 symbol graph 提取（本机热树上实测约 4 s——这里曾写「约 100s」，
        # 是失真的数，PR #314 终审实测推翻）。**搭 `swiftpm` job 的理由是计费不是耗时**：
        # 放进独立 job 会多起一台 macOS runner（按 10× 计费，见本文件顶部 push 触发器
        # 那段的同一考量）。
        #
        # ⚠️ 这条 `run:` 被**树内**判据 `Tests/OhMyDesignTests/MainActorStaticRatchetGuard.swift`
        # **逐字**钉住；那条判据还给**这一步的直接子键**上了一份**正面允许清单**
        # （`name` / `run` / `env` / `working-directory` / `uses` / `with`），清单外的键
        # 一律判红——`if:` / `continue-on-error:` / `shell:` 连同它们的同义拼法
        # （`"if": false` / `if : false` …）都在其中。job 的直接子键上则不许出现
        # `if` / `needs` / `continue-on-error` / `defaults`（比对前先归一化键名），
        # 且 `defaults` 在 **workflow 顶层**同样判红：写在顶层会被每个 job 继承，
        # `defaults.run.shell` 一改成 `bash -c "exit 0" {0}` 这一步就以退出码 0 空转。
        # ⚠️ 这条 `run:` 还必须是**行内标量**：改成 `run: |` 块标量当场判红
        # （`MainActorStaticRatchetGuard.runLineIsInlineScalar`）。理由是 `#304` 第 4 轮
        # 终审登记的「兄弟行不设防」——要在这条命令旁边塞一行 `exit 0` / `trap 'exit 0' ERR`，
        # **必须先**把它改写成块标量，所以钉住「不许是块标量」比按拼法追兄弟行便宜得多。
        # 要改写这一行（加参数、加 `| tee`、改成多行块标量），先改那条判据并说明理由。
        # 脚本自己的射程与代价（**不扫第三方模块的扩展块文件**）写在
        # `scripts/mainactor-static-ratchet.sh` 的《范围定案与代价》一节。
        run: bash scripts/mainactor-static-ratchet.sh

      - name: design-digest 未过期
        # 重跑生成器再与已提交产物比对：`docs/design-digest.md` 是台账，改了组件不重跑
        # 就会静默落后，而它的**唯一价值**是名字与源码同真——漂掉比不存在更坏（下游
        # 设计 agent 会自信地标注已改名/删除的组件，且失效方向向绿）。
        # ⚠️ 这条 `run:` 被树内判据 `Tests/OhMyDesignTests/DesignDigestSyncGuard.swift`
        # 逐字钉住，要改先改那条判据。生成器基数不符时返回 1、`&&` 短路，所以这一步
        # 同时兜住「基数变了没人看一眼」。
        run: python3 scripts/design-digest.py && git diff --exit-code -- docs/design-digest.md

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiftpm-logs
          path: '*.log'
          if-no-files-found: ignore

  simulator:
    name: iOS Simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 本步骤治的是两件**不同**的事，别混为一谈（`#348`）：
      #
      # (a) **已观测到的故障：CoreSimulator 瞬时零设备。** run 34138058495 attempt 1
      #     在 `macos-26-arm64 / 20260831.0337.3` 上 60s 查找超时后报
      #     `Unable to find a device matching the provided destination specifier`，
      #     而 `Available destinations` 里**一台具体的 iOS 模拟器都没有**（只有 macOS 与
      #     tvOS/visionOS/watchOS placeholder）。attempt 2 **同一镜像、同一 destination 写法**
      #     直接绿。⇒ 与设备名无关，任何写法都会失败。对准它的是下面的**有界重试**。
      # (b) **假设性风险：镜像换设备名。** 硬编码 `name=iPhone 17 Pro` 依赖那个名字一直存在。
      #     这条**至今没有观测到**，动态挑设备是对它的预防。
      #
      # ⚠️⚠️ **绝不能改成「找不到设备就跳过」**：那会把硬红换成假绿，正是 CLAUDE.md
      # 《退出码 0，却一条测试都没跑》那一节在治的病。本步骤穷尽重试后 **exit 1**。
      # ⚠️ 失败路径最坏约 **400s**（3×120s 的 simctl 超时 + 2×20s 退避），别以为只多 40s。
      - name: Select iOS simulator
        id: sim
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            UDID=$(python3 - <<'PY'
          import json, re, subprocess, sys
          try:
              raw = subprocess.run(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  capture_output=True, text=True, check=True, timeout=120,
              ).stdout
          except Exception as error:                 # 超时 / 非零退出都当「这一轮没拿到」
              print(f"simctl 失败：{error}", file=sys.stderr)
              sys.exit(1)
          best = None
          total = 0          # 所有可用设备（任何平台 / 任何版本）
          eligible = 0       # iOS ≥ 26 的可用 iPhone
          for runtime, devices in json.loads(raw).get("devices", {}).items():
              total += len(devices)
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              if version < (26, 0):          # 本包的部署目标
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if not device.get("isAvailable") or "iPhone" not in name or not device.get("udid"):
                      continue
                  # ⚠️ 取最小值 ⇒ **≥26 里最低的 runtime**、同版本里**字典序最小的机型名**
                  # （即最老一代 Pro）。这是有意的：在部署目标下限上跑，比在最新款上跑更保守。
                  rank = (version, 0 if re.fullmatch(r"iPhone \d+ Pro", name) else 1, name)
                  eligible += 1
                  if best is None or rank < best[0]:
                      best = (rank, device["udid"], name, runtime)
          # ⚠️ 这两个数是 `::error::` 判读法的**唯一**依据 —— 别改成打印 `simctl list` 的文本：
          # 零设备时它**照样打 header**（实测 `== Devices ==` + 各 runtime 标题），
          # 「列表为空」这个观测**根本不存在**，读者只会误判成「镜像变了」。
          print(f"ZZCOUNT total={total} eligible={eligible}", file=sys.stderr)
          if best is None:
              sys.exit(1)
          print(f"{best[1]}\t{best[2]}\t{best[3]}")
          PY
            ) && [ -n "$UDID" ] && break
            echo "第 $attempt 次没选到设备"
            [ "$attempt" -lt 3 ] && sleep 20
            UDID=""
          done
          if [ -z "$UDID" ]; then
            echo "::error::没在 runner 上选到 iOS 26+ 的 iPhone 模拟器（已重试 3 次）—— **与被测代码无关**。按上面每轮打印的 ZZCOUNT 判读：**total=0** ⇒ CoreSimulator 一台设备都没有（瞬时故障，#348 实测过一次、同一镜像重跑即绿）⇒ **直接重跑本 job**；**total>0 而 eligible=0** ⇒ runner 上有设备但没有 iOS 26+ 的 iPhone ⇒ **镜像变了，改本步骤的筛选条件**。"
            exit 1
          fi
          echo "$UDID" | awk -F'\t' '{ printf "选中 %s（%s）\nudid=%s\n", $2, $3, $1 }'
          echo "udid=$(echo "$UDID" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        # ToastHostTests 被跳过：三个 timing 用例依赖 Task.sleep 真实墙钟，buffer
        # 取 0.3–0.5s。在 CI runner 上实测**稳定失败**（连跑两次都红，不是偶发），
        # buffer 在该负载下持续不够。它们是平台无关的状态机断言，SwiftPM job
        # 已经覆盖且通过；在 simulator 里重跑一遍不增加任何信号，只会让这个
        # job 永久红。本 job 的存在意义是 iOS 特有断言（#4 的布局层）。
        # 加大 buffer 属于测试改动，归 #7，不在本任务范围。
        #
        # 标识符要用**类型名**（ToastHostTests），不是 @Suite 的显示名——
        # 用显示名不报错，只是静默不生效。
        #
        # 布局断言层（#if os(iOS) 的 DynamicTypeLayoutTests）已由 #95（原 #4）落地，
        # 现在本 job 真正守护它。**切勿**把 DynamicTypeLayoutTests 加进下面的
        # -skip-testing 列表，否则该层在 CI 上空转（macOS 侧本就不编它）。
        #
        # ⚠️ **scheme 必须是 `OhMyDesign-Package`，不能是 `OhMyDesign`**（#245）：
        # 包只有**一个** product 时，Xcode 把包 scheme 合并进同名 scheme，于是
        # `-scheme OhMyDesign` 恰好能跑测试。`#245` 新增了 OhMyDesignEffects /
        # OhMyDesignCharts 两个 product 之后，scheme 列表变成
        # OhMyDesign / OhMyDesign-Package / OhMyDesignEffects / OhMyDesignCharts，
        # 而 `-scheme OhMyDesign` 会**硬红**（不是静默跳过）：
        #   xcodebuild: error: Scheme OhMyDesign is not currently configured
        #   for the test action.
        # 本仓实测记录见 #245 的验证留证。
        # `-skip-testing:` 用的是 target/类型名标识符，在包 scheme 下语法不变。
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme OhMyDesign-Package \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:OhMyDesignTests/ToastHostTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-first.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: 'ios-*.log'
          if-no-files-found: ignore

  downstream-probe:
    name: Downstream API probe
    # 库的其余验证全都跑在启用了 defaultIsolation 的 target **内部**，
    # 结构上看不见「下游从 nonisolated 上下文能否使用公开 API」。
    # 这个 job 是唯一的下游视角，防的是公开 API 隔离契约的静默回归。
    #
    # ⚠️⚠️ `-Xswiftc -warnings-as-errors` **不是可省的严格度装饰**（#290）：
    # 隔离契约的破法**大多数是 warning 而不是 error**——公开常量长在 `View` /
    # `Transition` 上时，MainActor 隔离由 SwiftUI 的协议遵从推断而来，编译器
    # 把「从 nonisolated 上下文读它」降级成 warning。⇒ 不带这个标志，这个 job
    # 对**整整一类**隔离回归是空的。最直接的反证是它自己的历史：本包一度带着
    # 5 条这样的 warning，而这个 job 一直是绿的（#290 的起因）。
    #
    # ⚠️ 「加了标志」不等于「它真的会响」：`selftest-warnings-as-errors.sh` 塞一个
    # 必然产生 warning 的临时文件进 probe，断言这条命令**判红**、删掉后**判绿**
    # ——那是本仓 AD-E 对新守卫的一贯要求（能触发红的 fixture）。
    #
    # ⚠️ 而「selftest 绿」也不等于「CI 跑的是这条命令」——selftest 自己硬编码这个
    # 标志。把下面那步改回裸 `swift build`，selftest 照样绿、整道闸静默消失。
    # 钉住它的是**树内**判据 `Tests/OhMyDesignTests/DownstreamProbeGateGuard.swift`
    # （读本文件，断言下面这条 `run:` 逐字含该标志）⇒ 随 `swift test` 在每个事件上跑。
    #
    # ⚠️ 那条判据还会拦一批「标志还在、但红点传不到 job 结论 / 这个 job 压根没跑」的
    # 改法（PR #304 第 2 轮终审 I-2、第 3 轮 C-2/I-C）。**别把下面这串读成穷举清单**，
    # 判据自己的头注释里写着哪些仍然敞着（`on:` 收窄、`paths-ignore:`、假的 `runs-on:`）：
    #   · 下面那条构建 `run:` 必须**逐字**等于
    #     `cd scripts/downstream-probe && swift build -Xswiftc -warnings-as-errors`
    #     ——后面接**任何**尾巴都判红（` || true` / ` ||true`（少一个空格也算）/
    #     `|| :` / `|| exit 0` / `|| echo skipped` / `; true` / 换行接 `true` / `2>/dev/null` …）。
    #     ⚠️ 这条也意味着给它加合法后缀（`--verbose`、`| tee build.log`）同样判红。
    #   · 这个 job 块里出现 `continue-on-error:` / `if:` / `needs:` / `shell:` 任意一个，判红。
    #     （`needs:` 不是理论洁癖：`needs: bool-ratchet` 会让本 job 在**每一次 push 事件**
    #     上被跳过，因为 `bool-ratchet` 自己带着 `if: github.event_name == 'pull_request'`。）
    #   · 块标量里用 `echo "<整条命令>"` 冒充真命令、把命令塞进 `uses:` 步骤的 `with:` 下面，
    #     判据都不认（它先剥引号、丢 `echo`/`printf` 行、只认步骤自己的 `run:` 键）。
    #   ⚠️ **但它锁的是「那一行」——同一个 `run:` 块里的兄弟行完全不设防**
    #     （PR #304 第 4 轮终审 C-2'，**已登记、本轮未堵**）：把这条命令逐字保留不动，
    #     在它上面加一行 `exit 0` / `trap 'exit 0' ERR` / `if false; then` / `eval "exit 0"` /
    #     `swift() { exit 0; }`，或把它塞进一个 `cat <<'EOF' > /dev/null` 诱饵里，
    #     判据**全绿**而这条命令一次都不会跑。⇒ 这一步的 `run:` 请**保持单行**。
    # 真要加，先改判据并说明理由——别以为它只看那个标志。
    # 另：`run:` 里那一串是**逐字**匹配的，改写成语义等价的多行 / 折叠标量会判红
    #（fail-closed，但报错信息像 bug）；唯一被放行的等价写法是 shell 反斜杠续行。
    #
    # ⚠️⚠️ **副作用：这个标志顺带给了库自身一道零警告闸**（PR #304 终审 S-2）。
    # `-Xswiftc` 会传给**依赖图里所有** Swift 编译，而 probe 的依赖图包含
    # `OhMyDesign` / `OhMyDesignEffects` / `OhMyDesignCharts` 三个 target 的源码。
    # ⇒ 从此 `Sources/` 里**任何一条** warning 都会让**这个 job** 变红，而同一个 PR 的
    # `swift build` job 是绿的（那条不带标志）。方向是 fail-closed（好事），
    # 但失效形态会认错人：工具链升级引入一条 deprecation 时，**红点出现在
    # 「Downstream API probe」这个名字完全对不上的 job 里**。
    # 先看这一段，再去翻日志里那条 `Sources/...: error: ... deprecated`。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build downstream probe
        run: cd scripts/downstream-probe && swift build -Xswiftc -warnings-as-errors
      - name: Self-test the warnings-as-errors gate
        run: scripts/downstream-probe/selftest-warnings-as-errors.sh
      # Tree 搜索读数 harness（#441）也是独立包，只在这里构建（不跑基准：读数要有显示器的 macOS 会话）。
      - name: Build tree search benchmark
        run: cd scripts/tree-search-benchmark && swift build

  bool-ratchet:
    name: Bool exemption ratchet
    # ⚠️ 只在 PR 上跑：它要比对 **base 分支 tip** 与 HEAD 两个 revision，push 事件上没有
    # 有意义的比对对象。树内那一半（清单条目数 ≡ maxEntries）随 swift test 在每个
    # 事件上都跑，不依赖本 job。
    #
    # ⚠️⚠️ **这个 `if:` 是一个真实的棘轮缺口，不是「无害地跳过一个用不到的检查」**
    # （Task 8 终审 M-4）：两个仓的 `epic/component-contract` 分支**都没有分支保护**
    # （见 `docs/component-contract.md` / `epic.md` 对该事实的记录），因此 `push` 到
    # `epic/**`（本文件顶部 `on.push.branches` 已声明会触发）是**唯一能绕开 PR** 的路径
    # ——而这个 job 恰好完全不在 push 事件上跑。跨历史棘轮（本 job）与树内等式
    # （`BoolExemptionGuard.baselineRatchetHoldsExactly`，随 `swift test` 在 push 上
    # 也会跑）合起来才是「完整棘轮」这句话，在直接 push 场景下**只剩树内那一半**：
    # 树内等式现在拦两条——「清单条目数与 maxEntries 不一致」与「源码位置数与
    # sourceSites 不一致」（Task 8 终审新增，见
    # `BoolExemptionGuard.baselineRatchetHoldsExactly`）——但两条都拦不住「对应字段
    # 与清单 / 源码位置数**一起**、**在同一次 push 里**抬高」：那种改法两者仍然相等，
    # 树内判据看不出「上限被抬高」这个破例动作本身。⚠️ **`sourceSites` 比
    # `maxEntries` 更弱一层**：即使换到 PR 场景，`maxEntries` 好歹有本 job 跑的跨历史
    # 脚本兜底，`scripts/bool-exemptions-ratchet.sh` 完全不读 `sourceSites`——它在
    # push 与 PR 两种场景下都没有跨历史校验，只挡「本次 diff 里不一致」，跨历史闸
    # 移交 #41/#43。直接 push 到 `epic/**` 因此仍是一条未被机器挡住的路径，只能靠
    # 人工 review 或后续补分支保护堵上，本条注释只留痕、不实现。
    if: github.event_name == 'pull_request'
    # ⚠️ 刻意用 ubuntu 而非 macos：本 job 只要 git + python3，而 macOS runner 按 10×
    # 计费（见本文件顶部 push 触发器那段注释的同一考量）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ 默认 fetch-depth: 1 拿不到 base 的历史 —— 那正是「一份文件方案」在本仓
          # 行不通的头号原因（见 docs/bool-exemptions-baseline.json 的守卫注释）。
          fetch-depth: 0

      - name: Bool exemption ratchet
        # ⚠️ **比对 base 分支的当前 tip，不用 `github.event.pull_request.base.sha`。**
        # base.sha 是 GitHub 在 **PR 创建时**记录的快照，**不跟随 base 分支推进**。
        # 具体后果：#39 合入 epic 之后，一个更早开出的 PR（如并行的 #40）拿到的 base.sha
        # 早于 #39 的合入点 ⇒ 那个 sha 上没有基线文件 ⇒ 脚本走「base 上无文件」分支
        # ⇒ **静默 fail-open**（而绿色 job 里的那行 ⚠️ 没有人会看到）。
        # 这正是本 epic 反复在堵的「文件读不到 ⇒ 绿」的 CI 变体。
        # ⇒ 用 `origin/$GITHUB_BASE_REF`：它永远是「合并后会变成什么」的那个 base。
        # 脚本侧同时改成 fail-closed（base 上无文件且本次也没新增它 ⇒ exit 1）。
        run: |
          set -euo pipefail
          # fetch-depth: 0 已经拉全历史，这一步只是确保远端跟踪分支存在（防御性，幂等）。
          git fetch --no-tags --quiet origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          bash scripts/bool-exemptions-ratchet.sh "origin/${GITHUB_BASE_REF}"
